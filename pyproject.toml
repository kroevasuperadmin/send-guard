[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "send-guard"
version = "0.1.0"
description = "Atomic per-recipient claims and look-back checks to run before you send email."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.scripts]
send-guard = "send_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
